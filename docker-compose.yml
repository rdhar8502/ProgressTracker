services:
  db:
    image: postgres:15-alpine
    container_name: progress_tracker_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker123}
      POSTGRES_DB: ${POSTGRES_DB:-progress_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"   # High port to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-progress_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: progress_tracker_app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker123}@db:5432/${POSTGRES_DB:-progress_tracker}
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey123changeme}
    ports:
      - "15000:8000"   # High port to avoid conflicts
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
    name: progress_tracker_pgdata
